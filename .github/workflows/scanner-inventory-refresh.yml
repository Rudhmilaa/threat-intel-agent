name: Refresh scanner inventory

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      SCANNER_INVENTORY_BACKEND: redis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed Redis from committed inventory (first run)
        run: python scripts/seed-scanner-redis.py --skip-es

      - name: Refresh known scanner inventory (Redis publish + export files)
        run: python -m threat_intel.scanner_inventory_maintenance --export-files --skip-es

      - name: Commit inventory updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/scanners/known_scanner_inventory.csv config/scanners/feeds/
          if git diff --staged --quiet; then
            echo "Scanner inventory unchanged."
          else
            git commit -m "$(cat <<'EOF'
Refresh known scanner inventory from official vendor feeds.

Redis-primary publish with CSV/feed JSON export for git review.

EOF
)"
            git push
          fi
