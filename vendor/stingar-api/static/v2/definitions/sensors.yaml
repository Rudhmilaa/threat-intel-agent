sensors:
  get:
    tags:
      - sensors
    summary: Get honeypots
    description: ""
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  properties:
                    count:
                      type: integer
                    documents:
                      type: array
                      items:
                        $ref: "../components/sensors.yaml#/components/schemas/Sensor"
sensors-byId:
  get:
    tags:
      - sensors
    summary: Get honeypots by Id
    description: ""
    operationId: getSensorById
    parameters:
      - name: sensorId
        in: path
        description: ID of sensor to return
        required: true
        schema:
          type: string
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../components/sensors.yaml#/components/schemas/Sensor"
      "404":
        description: sensor not found
        content:
          application/json:
            schema:
              $ref: "../components/errors.yaml#/components/schemas/Errors"
  delete:
    tags:
      - sensors
    summary: Delete sensor by id
    description: ""
    operationId: deleteSensorById
    parameters:
      - name: sensorId
        in: path
        description: Id of sensor to delete
        required: true
        schema:
          type: string
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../components/sensors.yaml#/components/schemas/Sensor"
      "404":
        description: host not found
        content:
          application/json:
            schema:
              $ref: "../components/errors.yaml#/components/schemas/Errors"

