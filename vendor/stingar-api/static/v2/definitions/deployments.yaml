      content:
        application/json:
          schema:
            $ref: '../components/deployments.yaml#/components/schemas/DeploymentSubmission'
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
          text/plain:
            schema:
              type: string

deployments-env:
  post:
    tags:
      - deployments
    summary: Get ENV file for deployment
    description: Returns the content of a ENV file for deployment POST data
    requestBody:
      description: ""
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/deployments.yaml#/components/schemas/DeploymentSubmission'
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
