deployments:
  get:
    tags:
      - deployments
    summary: Get deployments
    description: ""
    parameters:
      - name: uuid
        in: query
        description: UUID of deployment
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Status of deployment
        required: false
        schema:
          type: integer
      - name: address
        in: query
        description: Address of host for deployment
        required: false
        schema:
          type: string
      - name: ssh_port
        in: query
        description: SSH port of host for deployment
        schema:
          type: integer
      - name: username
        in: query
        description: Username of host for deployment
        schema:
          type: string
      - name: authkey_id
        in: query
        description: SSH authkey id to use for deployment
        schema:
          type: string
      - name: hp_type
        in: query
        description: Honeypot type for deployment
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of deployment records to return
        schema:
          type: integer
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "../components/deployments.yaml#/components/schemas/Deployment"
      "404":
        description: user not found
        content:
          application/json:
            schema:
              $ref: "../components/errors.yaml#/components/schemas/Errors"
  post:
    tags:
      - deployments
    summary: Deploy a new honeypot with given configuration options
    description: ""
    requestBody:
      description: ""
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/deployments.yaml#/components/schemas/DeploymentSubmission'
    security:
      - ApiKeyAuth: []
    responses:
      "200":
        description: successful operation
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "../components/deployments.yaml#/components/schemas/Deployment"

deployments-compose:
  post:
    tags:
      - deployments
    summary: Get docker-compose.yml file for deployment
