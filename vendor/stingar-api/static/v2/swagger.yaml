  /store/honeypots:
    $ref: 'definitions/store.yaml#/store-honeypots'
  /store/honeypots/count:
    get:
      tags:
        - Store
      summary: Get count of available honeypots from remote store
      description: Retrieve the count of available honeypots from the remote store with local cache fallback
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Count of available honeypots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Number of available honeypots
                    required:
                      - count
                  source:
                    type: string
                    enum: [remote, cache]
                    description: Source of the count data (remote store or local cache)
                required:
                  - data
                  - source
        '503':
          $ref: 'components/errors.yaml#/components/schemas/ServiceUnavailable'
        '500':
          $ref: 'components/errors.yaml#/components/schemas/InternalServerError'
  /store/honeypots/{ident}:
    $ref: 'definitions/store.yaml#/store-honeypots-byId'
  /store/search:
    $ref: 'definitions/store.yaml#/store-search'
  /store/categories:
