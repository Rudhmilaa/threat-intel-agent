  /system/update/status/{job_id}:
    $ref: 'definitions/system.yaml#/system-update-status-byJobId'
  /settings/update:
    $ref: 'definitions/system.yaml#/settings-update'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: api-key


externalDocs:
