#<system>
#  log_level debug
#  log_format json
#</system>

<source>
  @type forward
  <transport tls>
    insecure true
  </transport>
  <security>
    self_hostname efk.local
    shared_key "#{ENV['FLUENTD_KEY']}"
  </security>
  port "#{ENV['FLUENTD_PORT']}"
  bind 0.0.0.0
</source>

<source>
  @type forward
  self_hostname efk.local
  port "#{ENV['FLUENTD_LOCAL_PORT']}"
  bind 0.0.0.0
</source>

<filter stingar.events.*>
  @type geoip
  geoip_lookup_keys src_ip
  <record>
    geo_cc      ${country.iso_code["src_ip"]}
    geo_city    ${city.names.en["src_ip"]}
    geo_Loc  '{ "lat": ${location.latitude["src_ip"]}, "lon": ${location.longitude["src_ip"]} }'
  </record>
  skip_adding_null_record true
</filter>

<filter stingar.events.*>
  @type geoip
  geoip_lookup_keys src_ip
  geoip2_database /fluentd/etc/GeoLite2-ASN.mmdb
  backend_library geoip2_c
  <record>
    geo_asn     ${autonomous_system_number["src_ip"]}
    geo_asn_org ${autonomous_system_organization["src_ip"]}
  </record>
  skip_adding_null_record true
</filter>

<filter stingar.events.*>
  @type record_transformer
  enable_ruby true  # Enable Ruby code execution
  <record>
    hp_data ${(record["hp_data"] || {}).merge("geo_city" => record["geo_city"], "geo_cc" => record["geo_cc"], "geopoint" => record["geo_Loc"], "geo_asn" => record["geo_asn"], "geo_asn_org" => record["geo_asn_org"])}
  </record>
  remove_keys geo_city,geo_cc,geo_Loc,geo_asn,geo_asn_org  # Clean up temporary fields
</filter>

<match stingar.events.*>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
# additions to avoid fluentd output plugin incompatibility with elasticsearch image version 
    verify_es_version_at_startup false
    default_elasticsearch_version 8
    logstash_format true
    logstash_prefix stingar
    logstash_dateformat %Y-%m-%d
    include_tag_key true
    tag_key fluentd_tag
    flush_interval 1s
    type_name fluentd
#    template_name "event_mappings.json"
#    template_file "/fluentd/etc/event_mappings.json"
#    @log_level warn
  </store>

#  <store>
#    @type stdout
#    @log_level debug
#  </store>

  @include "#{(ENV['CIF_ENABLED'] || '').strip.downcase == 'true' ? '/fluentd/etc/out_conf/cif.conf' : '/dummy_cif'}"

  @include "#{(ENV['FILE_ENABLED'] || '').strip.downcase == 'true' ? '/fluentd/etc/out_conf/file.conf' : '/dummy_file'}"

  @include "#{(ENV['SYSLOG_ENABLED'] || '').strip.downcase == 'true' ? '/fluentd/etc/out_conf/syslog.conf' : '/dummy_syslog'}"

</match>


<match stingar.sensors>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    # additions to avoid fluentd output plugin incompatibility with elasticsearch image version 
    verify_es_version_at_startup false
    default_elasticsearch_version 8
    index_name sensors
    flush_interval 1s
    id_key uuid
    remove_keys_on_update created
    write_operation upsert
    type_name fluentd
#    template_name "sensor_mappings.json"
#    template_file "/fluentd/etc/sensor_mappings.json"
  </store>

  <store>
    @type stdout
  </store>
</match>

<match stingar.ansible>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    # additions to avoid fluentd output plugin incompatibility with elasticsearch image version 
    verify_es_version_at_startup false
    default_elasticsearch_version 8
    logstash_format true
    logstash_prefix ansible
    logstash_dateformat %Y-%m-%d
    include_tag_key true
    tag_key fluentd_tag
    type_name fluentd
    flush_interval 1s
    @log_level warn
  </store>

  <store>
    @type stdout
  </store>
</match>

<match stingar.rawlogs.*>
  @type copy

  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    # additions to avoid fluentd output plugin incompatibility with elasticsearch image version 
    verify_es_version_at_startup false
    default_elasticsearch_version 8
    logstash_format true
    logstash_prefix rawlogs
    logstash_dateformat %Y-%m-%d
    include_tag_key true
    flush_interval 1s
    type_name fluentd
    @log_level warn
  </store>
</match>
